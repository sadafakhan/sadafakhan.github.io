 - title: LLM Technical Program Manager
   organization: NVIDIA Corporation
   location: Santa Clara, CA
   year: Aug. 2023 – Aug. 2025
   tags: [employment, research]
   description: 
    - Program-managed RLHF quality, synthetic data integrity, and red-teaming initiatives through sprint planning, retrospectives, and Jira-based dependency tracking, aligning cross-functional stakeholders on milestones, risks, and release-critical deliverables
    - title: Red-Teaming / Safety Benchmarking
      contents: 
        - Led red-teaming and safety benchmarking for multimodal LLM release cycles, evaluating 22+ models across 4 safety benchmarks (BBQ, AEGIS, garak, UnQover, HolisticBiasR) and 2k+ unique adversarial prompts generated by 70+ red-teamers
        - Authored and presented 9 model threat briefs and updated model cards to support launch decisions, indicated in documents such as <a href="https://arxiv.org/abs/2406.11704v1">Nemotron-4 340B Technical Report</a>
        - Built red-teaming program infrastructure including PRD, plan of record, guidelines, labelling schema, and platform UI; recruited and trained headcount
        - Analyzed 300 flagged outputs across 21 harm categories with cross-functional partners to identify systematic failure modes and establish gating metrics for model release
        - Automated execution of successful and sensitive prompts, and updated benchmark methodology through sub-sampling, condition filtering, and LLM-as-Judge scoring, reducing compute cost by 96.9%

    - title: Synthetic Data Integrity
      contents: 
        - Evaluated integrity and equivalency of synthetic datasets generated by foreign models across 5 domains (math, code, STEM, chat, tool-calling) to measure trustworthiness of post-training datasets
        - Led a cross-functional team (research, machine learning operations, data strategy) to define dataset integrity criteria and build a reusable evaluation framework using UMAP clustering, toxicity classifiers, and LLM-as-Judge methods, standardizing review of synthetic post-training data
        - Developed a GUI comparing 8 models’ performances, highlighting 30k prompt seeds that yielded concerning output from 3 target models

    - title: RLHF
      contents:
        - Conducted weekly data science analyses for RLHF vendor data to identify QA issues and drive interventions across guidelines, label schemas, reviewer workflows, increasing inter-annotator agreement in 17 annotator pool (Cohen’s kappa) on average from .45 to .72 across 300 tasks in 8 weeks.
        - Analyzed task time, answer length, rejection rate, scoring patterns, and cluster-level failure modes to diagnose annotation inconsistency and process drift
        - Established gating metrics and process to graduate 6 annotators from base pool to subject matter expert pool based on derived performance metrics, enabling generation of 400+ new golden data points for expert adjudication
        - Ran pilot program with LLM-as-Judge to pre-filter annotations and increase review throughput by 30%
    - Managed data harvesting pipeline for automatic speech processing block(s), supporting collection and validation of 200 hours across 7 languages
    - Created pipeline to produce and validate synthetic data as post-training data for Retrieval-Augmented Generation (RAG) models

